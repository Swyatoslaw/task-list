<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f7" />
    <title>Комнаты — Список задач</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/index.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./">
          <img src="favicon.svg" alt="" width="28" height="28" />
          <span>Список задач</span>
        </a>
        <button type="button" class="icon-btn" id="theme-toggle"></button>
      </div>
    </header>

    <main class="container narrow">
      <div id="config-warning" class="notice" hidden>
        Supabase не настроен. Укажите <code>SUPABASE_URL</code> и <code>SUPABASE_ANON_KEY</code> в файле
        <code>js/config.js</code> — инструкция в README.
      </div>

      <section class="panel">
        <h1 class="page-title">Новая комната</h1>
        <p class="muted">Комната — общее пространство со списками. Поделитесь ссылкой, чтобы работать вместе.</p>
        <form id="create-room" class="inline-form">
          <input
            class="input"
            id="room-name"
            name="name"
            type="text"
            placeholder="Название комнаты"
            maxlength="100"
            autocomplete="off"
            required
          />
          <button class="btn btn-primary" type="submit">Создать</button>
        </form>
      </section>

      <section class="panel" id="recent-section" hidden>
        <h2 class="section-title">Мои комнаты</h2>
        <p class="muted small">Комнаты, открытые на этом устройстве.</p>
        <ul class="room-list" id="recent-rooms"></ul>
      </section>
    </main>
  </body>
</html>
